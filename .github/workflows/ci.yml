name: CloudGuard CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: cloudguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: cloudguard_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: cloudguard

        ports:
          - "5432:5432"

        options: >-
          --health-cmd "pg_isready -U cloudguard_user -d cloudguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

    env:
      DATABASE_URL: postgresql+psycopg://cloudguard_user:test_password@localhost:5432/cloudguard
      JWT_SECRET: ci-only-secret-not-for-production
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-strong-password-123!
      AZURE_MODE: mock

    steps:
      # ------------------------------------------------------------
      # 1. Download the repository source code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install Python 3.12
      # ------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------------
      # 3. Install application and CI dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ------------------------------------------------------------
      # 4. Check for undefined names, unused imports and serious
      #    Python syntax problems
      # ------------------------------------------------------------
      - name: Run Ruff lint checks
        run: |
          ruff check src tests --select F,E9

      # ------------------------------------------------------------
      # 5. Verify that Python can compile the source files
      # ------------------------------------------------------------
      - name: Compile Python source
        run: |
          python -m compileall -q src

      # ------------------------------------------------------------
      # 6. Run static type checking
      # ------------------------------------------------------------
      - name: Run mypy type checks
        run: |
          mypy src/cloudguard \
            --ignore-missing-imports \
            --follow-imports=skip

      # ------------------------------------------------------------
      # 7. Apply all Alembic migrations to the temporary CI database
      # ------------------------------------------------------------
      - name: Run Alembic database migrations
        run: |
          alembic upgrade head

      # ------------------------------------------------------------
      # 8. Display and verify the current database revision
      # ------------------------------------------------------------
      - name: Verify Alembic migration
        run: |
          alembic current --check-heads

      # ------------------------------------------------------------
      # 9. Execute tests and enforce minimum 80% coverage
      # ------------------------------------------------------------
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=cloudguard.rules \
            --cov=cloudguard.services.remediation_service \
            --cov-report=term-missing \
            --cov-fail-under=80

      # ------------------------------------------------------------
      # 10. Configure Docker Buildx
      # ------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # 11. Build the Docker image without pushing it
      # ------------------------------------------------------------
      - name: Build CloudGuard Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: cloudguard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD remains in a separate manually triggered workflow.
  # A normal push or pull request cannot deploy to Azure or AKS.