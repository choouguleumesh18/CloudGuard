[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=cloudguard.rules --cov=cloudguard.services.remediation_service --cov-report=term-missing"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
