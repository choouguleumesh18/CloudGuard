apiVersion: batch/v1
kind: Job
metadata:
  name: cloudguard-migrations
  namespace: cloudguard
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: cloudguard-migrations
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: cloudguard-automation
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: migrations
          image: YOUR_REGISTRY/cloudguard:VERSION
          command: ["alembic", "upgrade", "head"]
          envFrom: [{secretRef: {name: cloudguard-config}}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
