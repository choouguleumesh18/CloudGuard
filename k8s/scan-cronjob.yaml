apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudguard-scheduled-scan
  namespace: cloudguard
  labels:
    app: cloudguard-scheduled-scan
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 600

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        metadata:
          labels:
            app: cloudguard-scheduled-scan
            azure.workload.identity/use: "true"

        spec:
          restartPolicy: Never
          serviceAccountName: cloudguard-automation

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: scheduled-scan
              image: YOUR_REGISTRY/cloudguard:VERSION
              imagePullPolicy: IfNotPresent

              command:
                - /bin/sh
                - -c

              args:
                - >
                  exec python -m cloudguard.cli scan
                  --subscription-id "$AZURE_DEFAULT_SUBSCRIPTION_ID"

              envFrom:
                - secretRef:
                    name: cloudguard-config

              env:
                - name: CLOUDGUARD_URL
                  value: http://cloudguard-api

                - name: CLOUDGUARD_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: cloudguard-config
                      key: AUTOMATION_USERNAME

                - name: CLOUDGUARD_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cloudguard-config
                      key: AUTOMATION_PASSWORD

              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL