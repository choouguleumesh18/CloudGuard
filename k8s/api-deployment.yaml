apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudguard-api
  namespace: cloudguard
  labels:
    app: cloudguard-api

spec:
  replicas: 1

  revisionHistoryLimit: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: cloudguard-api

  template:
    metadata:
      labels:
        app: cloudguard-api
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: cloudguard-automation
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api

          # CD replaces this placeholder with:
          # cloudguardacr2026.azurecr.io/cloudguard:<CI-SHA>
          image: YOUR_REGISTRY/cloudguard:VERSION

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - secretRef:
                name: cloudguard-config

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: cloudguard-api
  namespace: cloudguard
  labels:
    app: cloudguard-api

spec:
  type: LoadBalancer

  selector:
    app: cloudguard-api

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000