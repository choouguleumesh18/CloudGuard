apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudguard-job-dispatcher
  namespace: cloudguard
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
      - delete

  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudguard-job-dispatcher
  namespace: cloudguard
subjects:
  - kind: ServiceAccount
    name: cloudguard-automation
    namespace: cloudguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudguard-job-dispatcher